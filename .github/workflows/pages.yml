name: Deploy Prague rent map to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'prague-rent-map/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (text parsing, geocoding table, photo detection)
        working-directory: prague-rent-map
        run: node --test tests/parse.test.mjs tests/photos.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prague-rent-map
      - id: deployment
        uses: actions/deploy-pages@v4
